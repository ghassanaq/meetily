[workspace]
resolver = "2"
members = [
    "frontend/src-tauri",
    "llama-helper"
]

# Shared workspace settings
[workspace.package]
edition = "2021"
rust-version = "1.77"

# Shared dependencies that can be inherited by workspace members
[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32.0", features = ["full"] }

# Dependency patches are workspace-wide. Keeping the valid CPAL revision here
# ensures the Tauri package actually resolves the intended audio fix.
[patch.crates-io]
cpal = { git = "https://github.com/RustAudio/cpal", rev = "51c3b43" }

# Keep the sidecar's size optimization scoped to the sidecar. Cargo does not
# allow `lto` in package-specific profile overrides, so scoped LTO belongs in
# the dedicated sidecar build command rather than changing the main app build.
[profile.release.package.llama-helper]
codegen-units = 1
opt-level = "s"
