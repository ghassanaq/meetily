name: PR quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected areas
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true' }}
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect pull request changes
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - "frontend/**"
              - ".github/workflows/pr-quality.yml"
            rust:
              - "Cargo.toml"
              - "Cargo.lock"
              - ".cargo/**"
              - "rust-toolchain"
              - "rust-toolchain.toml"
              - "frontend/src-tauri/**"
              - "llama-helper/**"
              - ".github/workflows/pr-quality.yml"

  frontend:
    name: Lint, typecheck, test, and build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build

  rust:
    name: Locked workspace tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify CMake
        run: cmake --version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - name: Cache FFmpeg sidecar
        uses: actions/cache@v4
        with:
          path: frontend/src-tauri/binaries/ffmpeg-*.exe
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('frontend/src-tauri/build.rs', 'frontend/src-tauri/build/ffmpeg.rs') }}

      - name: Build llama-helper sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force frontend/src-tauri/binaries | Out-Null
          cargo build --locked -p llama-helper
          Copy-Item -Force target/debug/llama-helper.exe frontend/src-tauri/binaries/llama-helper-x86_64-pc-windows-msvc.exe

      - name: Provide placeholder frontendDist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force frontend/out | Out-Null
          Set-Content frontend/out/index.html "<!doctype html><title>ci</title>"

      - name: Run locked workspace tests
        run: cargo test --workspace --locked

  gate:
    name: PR quality gate
    if: always()
    needs:
      - changes
      - frontend
      - rust
    runs-on: ubuntu-latest

    steps:
      - name: Verify upstream results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          echo "changes=${CHANGES_RESULT} frontend=${FRONTEND_RESULT} rust=${RUST_RESULT}"

          if [ "${CHANGES_RESULT}" != "success" ]; then
            echo "Path detection did not succeed."
            exit 1
          fi

          case "${FRONTEND_RESULT}" in
            success|skipped) ;;
            *) echo "Frontend checks did not succeed."; exit 1 ;;
          esac

          case "${RUST_RESULT}" in
            success|skipped) ;;
            *) echo "Rust checks did not succeed."; exit 1 ;;
          esac
